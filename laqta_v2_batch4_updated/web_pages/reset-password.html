<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إعادة تعيين كلمة المرور — لَقطة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #F1EAD9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #FFFDF8;
    border: 1px solid #E6DCC3;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1E4E4A, #11302D);
    color: #E7B23A;
    font-weight: bold;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }
  h1 { font-size: 18px; color: #11302D; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #6B6255; margin: 0 0 20px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 1px solid #E6DCC3;
    border-radius: 10px;
    font-size: 14px;
    text-align: right;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #1E4E4A;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; }
  .msg.error { color: #C0392B; }
  .msg.success { color: #11302D; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ل</div>
    <h1 id="title">إعادة تعيين كلمة المرور</h1>
    <p class="sub" id="subtitle">اكتب كلمة مرور جديدة لحسابك على لَقطة</p>

    <div id="formArea">
      <input id="password" type="password" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)" />
      <input id="confirm" type="password" placeholder="تأكيد كلمة المرور" />
      <button id="submitBtn" onclick="submitNewPassword()">حفظ كلمة المرور الجديدة</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

  <script>
    // بدّل هالقيمتين إذا غيّرت مشروع Supabase — نفس القيم اللي بملف
    // lib/supabase_config.dart بتطبيق الفلاتر.
    const SUPABASE_URL = 'https://laufdfvzodhyrwvhlttm.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhdWZkZnZ6b2RoeXJ3dmhsdHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Mjg1NjUsImV4cCI6MjEwNTAwNDU2NX0.n-murWHf02aMMG3u70LjwL6HkpR-MEXRMLv8CwSDr3s';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    // بمجرد ما تفتح الصفحة من رابط الإيميل، مكتبة Supabase JS بتقرأ
    // التوكن من الرابط تلقائيًا وتنشئ جلسة مؤقتة (recovery session).
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('formArea').style.display = 'block';
      }
    });

    // لو الجلسة موجودة أصلًا وقت تحميل الصفحة (حالة شائعة)، اعرض النموذج مباشرة.
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        document.getElementById('formArea').style.display = 'block';
      } else {
        showMessage('الرابط غير صالح أو منتهي الصلاحية — اطلب رابطًا جديدًا من التطبيق.', 'error');
        document.getElementById('formArea').style.display = 'none';
      }
    });

    async function submitNewPassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('submitBtn');

      if (password.length < 6) {
        showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error');
        return;
      }
      if (password !== confirm) {
        showMessage('كلمتا المرور غير متطابقتين.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جارٍ الحفظ...';
      showMessage('', '');

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        showMessage('تعذّر حفظ كلمة المرور: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'حفظ كلمة المرور الجديدة';
      } else {
        document.getElementById('formArea').style.display = 'none';
        document.getElementById('title').textContent = 'تم بنجاح ✅';
        document.getElementById('subtitle').textContent = 'تم تحديث كلمة المرور. يمكنك الآن العودة لتطبيق لَقطة وتسجيل الدخول بكلمة المرور الجديدة.';
      }
    }
  </script>
</body>
</html>
