<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تم تأكيد الحساب — لَقطة</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #F1EAD9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #FFFDF8;
    border: 1px solid #E6DCC3;
    border-radius: 16px;
    padding: 36px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2F7D6B, #1E5A4C);
    color: #E7B23A;
    font-weight: bold;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #E4F4EC;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 32px; height: 32px; }
  h1 { font-size: 19px; color: #1E5A4C; margin: 0 0 8px; }
  p { font-size: 13.5px; color: #6B6255; line-height: 1.7; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ل</div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="11" fill="#22A366"/>
        <path d="M7 12.5L10.2 15.7L17 8.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>تم التأكد من حسابك ✅</h1>
    <p>الآن سجّل الدخول من تطبيق لَقطة باستخدام بريدك الإلكتروني وكلمة المرور.</p>
  </div>
</body>
</html>
